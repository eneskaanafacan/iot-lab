server.port=${PORT:8080}

server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB

spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/iot-dashboard}

iot.app.jwtSecret=${JWT_SECRET:changeme}
iot.app.jwtExpirationMs=3600000

telegram.bot.token=${TELEGRAM_BOT_TOKEN:YOUR_TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID:}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:}

app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:changeme}

spring.main.banner-mode=off
